# Deploy the demo to Pages. Minimal form, to isolate a job that would not start.
name: Deploy the demo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: drsamonline/app-builder/.github/workflows/pages.yml@main
    with:
      path: docs
