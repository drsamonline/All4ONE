name: Build Windows executable

# Produces a real utility_suite.exe on an actual Windows runner - this
# repository is normally developed/audited on Linux, and PyInstaller
# cannot cross-compile a Windows binary from Linux or macOS, so the exe
# build step must run on windows-latest.
#
# Trigger it from the GitHub UI: Actions tab -> "Build Windows executable"
# -> Run workflow. It also runs automatically on every push to main and
# on version tags (v*), and uploads the result as a downloadable artifact
# (and as a GitHub Release asset for tags).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25  # safety net: fail fast instead of hanging until the runner's own limit
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }

      - name: Static release audit
        # Fail fast on tracked cache/log clutter BEFORE the heavyweight ZIP
        # rebuild, so the error message points at the real cause.
        run: python audit.py

      - name: Rebuild plugin ZIPs (deterministic, matches source tree)
        run: python create_plugin_zips.py

      - name: Behavioral smoke tests
        run: python -B -m tests.test_suite

      # NOTE: tests/test_all_tools.py (the exhaustive per-tool sweep) is
      # intentionally NOT run here. On a real Windows runner, tools that
      # are dependency-gated as "unavailable" on the audit/dev machine
      # (services, registry, event log, network adapter reset, System
      # Restore, driver export, scheduled tasks) become genuinely
      # available and would actually execute against the shared CI VM.
      # Some require an interactive UAC elevation prompt that will never
      # be answered in CI (net-reset), and others can legitimately take
      # a long time or fail unpredictably in a locked-down runner
      # (System Restore is commonly disabled on ephemeral cloud VMs).
      # That combination previously stalled/broke this exact workflow.
      # Run tests/test_all_tools.py locally on a disposable Windows VM
      # instead, where side effects and hangs are acceptable - see
      # DEVELOPER_GUIDE.md.

      - name: Build with PyInstaller
        run: python -m PyInstaller build.spec --clean --noconfirm

      - name: Copy plugins/ next to the built executable
        # plugins/ must sit BESIDE utility_suite.exe as a plain, editable
        # folder - see build.spec for why it is intentionally not bundled
        # via PyInstaller `datas` (which would bury it inside _internal/,
        # where the app never looks - this previously caused a packaged
        # build to silently report "Total tools: 0").
        run: |
          Copy-Item -Path plugins -Destination dist\utility_suite\plugins -Recurse -Force
          New-Item -ItemType Directory -Force -Path dist\utility_suite\logs | Out-Null

      - name: Smoke-test the built executable
        run: |
          $toolCount = & dist\utility_suite\utility_suite.exe list | Select-String -Pattern 'Total tools:'
          Write-Host $toolCount
          if ($toolCount -match 'Total tools: 0') {
            Write-Error 'Packaged executable found 0 tools - plugins were not placed correctly.'
            exit 1
          }
          & dist\utility_suite\utility_suite.exe --version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: utility_suite-windows
          path: dist/utility_suite/
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/utility_suite/**
