name: Regenerate generated docs

# TOOL_CATALOG.md and docs/index.html are produced from the live registry.
# When the code that feeds them changes, this regenerates and commits them,
# so the repository never carries a catalogue that disagrees with the app.

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "core/**"
      - "ui/**"
      - "scripts/catalogue.py"
      - "scripts/landing.py"
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-docs
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate from the registry
        run: |
          python scripts/catalogue.py
          python scripts/landing.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- TOOL_CATALOG.md docs/index.html; then
            echo "Generated docs are already current."
            exit 0
          fi
          git config user.name "all4one-docs"
          git config user.email "actions@users.noreply.github.com"
          git add TOOL_CATALOG.md docs/index.html
          git commit -m "docs: regenerate the catalogue and landing page from the registry"
          git push
