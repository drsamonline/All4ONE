name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional dependencies used by the sweep
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pypdf openpyxl python-docx cryptography psutil ruff

      - name: Repository and catalogue audit
        run: python scripts/audit.py

      - name: Run every runnable tool against fixtures
        run: python tests/sweep.py

      - name: Catalogue is up to date
        run: |
          python scripts/catalogue.py
          git diff --exit-code TOOL_CATALOG.md || {
            echo "TOOL_CATALOG.md is stale — run python scripts/catalogue.py and commit it."
            exit 1
          }

      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check .

      - name: CLI smoke test
        run: |
          python main.py list | head -20
          python main.py search pdf | head -5
          python main.py show pdf-merge
          echo "hello" > /tmp/sample.txt
          python main.py run hash-file --file /tmp/sample.txt --algorithm sha256

  desktop-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon0 libdbus-1-3 libgl1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials pillow pypdf

      - name: Build the window headlessly and walk every page
        env:
          QT_QPA_PLATFORM: offscreen
        run: python smoke_ui.py

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: shots/
