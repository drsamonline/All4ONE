name: CI (Linux validation)

# Fast, dependency-free validation on every push / pull request:
#   - ruff lint gate (advisory for now - warnings only, see step comment)
#   - static release audit (audit.py) - HARD gate, blocks the build
#   - behavioral smoke tests        - HARD gate, blocks the build
# The Windows exe build lives in build-windows-exe.yml; this workflow
# guarantees the tree stays valid on Linux too (where it is developed).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Least privilege: this workflow only reads the repo. Explicitly dropping
# write scopes prevents a compromised dependency in a step from pushing
# commits or creating releases.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
# Saves runner minutes and avoids stale results blocking a newer commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # was @v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Ruff lint (advisory - non-blocking)
        # Advisory until the codebase is fully ruff-clean; once
        # `ruff check .` exits 0, remove continue-on-error to make this
        # a hard gate.
        continue-on-error: true
        run: ruff check .

      - name: No committed build/cache artifacts
        # Regression guard: __pycache__/*.pyc and logs/*.log must never be
        # tracked (a stray commit of these once failed every CI job via the
        # audit gate below). Fails with the offending paths listed.
        run: |
          # F-34: `|| true` here is correct and load-bearing - grep exits 1 when it finds NOTHING,
          # which is the pass case. An empty $bad is success, not a swallowed error.
          bad=$(git ls-files | grep -E '__pycache__|\.py[cod]$|^logs/.*\.log$' || true)
          if [ -n "$bad" ]; then
            echo "Tracked build/runtime artifacts found:"; echo "$bad"; exit 1
          fi

      - name: Catalogues are up to date
        # TOOL_CATALOG.md / EXPANSION_CATALOG.md are generated from the live
        # registry by generate_catalogs.py; fail if a tool change was merged
        # without regenerating them (audit.py enforces header counts too, but
        # this shows the exact diff that is missing).
        run: |
          python generate_catalogs.py
          git diff --exit-code TOOL_CATALOG.md EXPANSION_CATALOG.md || {
            echo "Catalogues are stale. Run 'python generate_catalogs.py' locally and commit."; exit 1; }

      - name: Static release audit
        run: python audit.py

      - name: Behavioral smoke tests
        run: python -B -m tests.test_suite

      - name: Bundle determinism (line endings)
        # build_bundle() must produce byte-identical archives from LF and CRLF
        # checkouts; a Windows contributor with core.autocrlf=true would
        # otherwise leave the tracked bundle permanently dirty.
        run: python -B -m tests.test_bundle_determinism

      - name: Registry merge precedence
        # A released exe always carries bundle/tools.dat, so build_registry()
        # must MERGE external plugins/ over the embedded bundle instead of
        # returning early on the bundle. Regression guard for that defect.
        run: python -B -m tests.test_registry_merge

      - name: Per-pack enable/disable
        # Disabled packs must vanish from listing/search and be refused by
        # get_tool/run_tool, and the choice must persist across a reload.
        run: python -B -m tests.test_packs

      - name: Tool metadata
        # Optional accepts/produces/destructive fields drive the conditional
        # GUI; a pack's own values must win over the curated table.
        run: python -B -m tests.test_tool_metadata

      - name: Dependency catalogue honesty
        # The catalogue must list exactly the dependencies the packs declare,
        # and nothing here may download or execute a binary.
        run: python -B -m tests.test_dependencies

      - name: Headless GUI construction
        # Builds the whole widget tree against a fake tkinter so a NameError /
        # AttributeError in the GUI is caught without a display.
        run: python -B -m tests.test_gui_headless
