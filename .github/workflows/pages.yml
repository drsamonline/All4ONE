name: Publish landing page

# Serves docs/ as the project site. One-time setup: Settings → Pages →
# Source: "GitHub Actions". After that, every push to main republishes it.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/landing.py"
      - "core/**"
      - "tools/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the landing page from the live registry
        run: |
          python scripts/landing.py
          if ! git diff --quiet docs/index.html; then
            echo "::warning::docs/index.html was stale and has been regenerated for this deploy"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
