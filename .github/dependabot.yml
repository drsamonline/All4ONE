version: 2

updates:
  # Keep GitHub Actions (checkout, setup-python, upload-artifact, the release
  # action, ...) current. This is the supply-chain hardening called for by the
  # 2026-10 audit: workflows currently pin actions to moving major tags.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Track the optional runtime packages documented in requirements.txt.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
