[project]
name = "all4one"
version = "4.0.0"
description = "One portable utility, every tool on its own page."
requires-python = ">=3.10"
authors = [{ name = "Dr. Sohil Momin" }]
license = { text = "PolyForm Noncommercial 1.0.0" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["B008"]      # Field factories in decorators are the API
